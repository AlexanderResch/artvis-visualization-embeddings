services:

  backend:
    container_name: artvis-embedding-backend

    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    env_file:
      - .env

    environment:
      ARTVIS_CATALOGUE_ENTRIES_CSV: /app/data/catalogue_entries.csv

      ML_RANDOM_SEED: "42"
      TORCH_NUM_THREADS: "8"

      ATTRIBUTE_DIM: "128"
      COMPLEX_DIM: "64"
      ATTRIBUTE_HIDDEN_DIM: "128"

      TRAIN_EPOCHS: "40"
      FINAL_TRAIN_EPOCHS: "6"

      TRAIN_BATCH_SIZE: "2048"
      NEGATIVES_PER_POSITIVE: "1"

      LEARNING_RATE: "0.001"
      WEIGHT_DECAY: "0.00001"

      RELATION_EPOCH_CAP: "250000"
      EARLY_STOPPING_PATIENCE: "5"

      HDBSCAN_MIN_CLUSTER_SIZES: "50"
      HDBSCAN_MIN_SAMPLES_VALUES: "10"
      HDBSCAN_CLUSTER_SELECTION_METHOD: eom
      HDBSCAN_MAX_NOISE_FRACTION: "0.80"
      HDBSCAN_PCA_VARIANCE: "0.95"
      HDBSCAN_PCA_MAX_COMPONENTS: "50"

      UMAP_INPUT_MODE: pca
      UMAP_N_NEIGHBORS: "30"
      UMAP_MIN_DIST: "0.10"
      UMAP_METRIC: euclidean

    volumes:
      - ./backend/app/ml/data:/app/app/ml/data:ro
      - ./artvis-graph-db/csv/catalogue_entries.csv:/app/data/catalogue_entries.csv:ro

    networks:
      - artvis-net

    restart: unless-stopped


  frontend:
    container_name: artvis-embedding-explorer

    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /embedding-explorer/api

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - backend

    networks:
      - artvis-net

    restart: unless-stopped


networks:
  artvis-net:
    name: artvis-network
    external: true