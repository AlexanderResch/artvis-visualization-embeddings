services:

  backend:
    container_name: artvis-embedding-backend

    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    env_file:
      - .env

    environment:
      ARTVIS_CATALOGUE_ENTRIES_CSV: /app/data/catalogue_entries.csv
      MICRO_ENTRY_DATA_DIR: /app/data/micro_entries

    volumes:
      - ./backend/app/ml/data:/app/app/ml/data:ro
      - ./backend/data/micro_entries:/app/data/micro_entries
      - ./artvis-graph-db/csv/catalogue_entries.csv:/app/data/catalogue_entries.csv:ro

    networks:
      - artvis-net

    restart: unless-stopped


  frontend:
    container_name: artvis-embedding-explorer

    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /embedding-explorer/api

    ports:
      - "127.0.0.1:3000:80"

    depends_on:
      - backend

    networks:
      - artvis-net

    restart: unless-stopped


networks:
  artvis-net:
    name: artvis-network
    external: true
