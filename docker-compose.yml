services:
  artvis-db:
    container_name: artvis-db
    networks:
      - artvis-network
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: on-failure
    volumes:
      - ./artvis-graph-db/import.sh:/var/lib/neo4j/import.sh
      - ./artvis-graph-db/certificates:/var/lib/neo4j/certificates
      - ./artvis-graph-db/neo4j_dump:/var/lib/neo4j/dump
    env_file:
      - ./artvis-graph-db/dev.env
    environment:
      NEO4J_PLUGINS: '["apoc", "apoc-extended", "graph-data-science"]'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687
          -u "$${NEO4J_AUTH%%/*}"
          -p "$${NEO4J_AUTH#*/}"
          "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    build:
      context: ./artvis-graph-db
      dockerfile: Dockerfile

  backend:
    build:
      context: ./backend
    container_name: artvis-backend
    env_file:
      - ./artvis-graph-db/dev.env
    environment:
      NEO4J_URI: bolt://artvis-db:7687
      ARTVIS_CATALOGUE_ENTRIES_CSV: /app/data/catalogue_entries.csv
      MICRO_ENTRY_DATA_DIR: /app/data/micro_entries
    volumes:
      - ./backend/app:/app/app
      - ./backend/data/micro_entries:/app/data/micro_entries
      - ./artvis-graph-db/csv/catalogue_entries.csv:/app/data/catalogue_entries.csv:ro
    ports:
      - "8000:8000"
    depends_on:
      artvis-db:
        condition: service_healthy
    networks:
      - artvis-network

  frontend:
    build:
      context: ./frontend
    container_name: artvis-frontend
    networks:
      - artvis-network
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started

networks:
  artvis-network:
    name: artvis-network
    driver: bridge
