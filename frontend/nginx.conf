server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API when accessed through /embedding-explorer
    location /embedding-explorer/api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API when the outer TU nginx already removed /embedding-explorer
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend under /embedding-explorer
    location /embedding-explorer/ {
        rewrite ^/embedding-explorer/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Also support requests where the outer proxy strips the prefix
    location / {
        try_files $uri $uri/ /index.html;
    }
}